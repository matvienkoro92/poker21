    </div>
    <script>
      const app = document.getElementById('app');
      const tabs = app.querySelectorAll('.bottom-nav [data-view-target]');
      function selectTab(name) {
        const home = name === 'home';
        for (const view of app.querySelectorAll('.view[data-view]')) {
          view.classList.toggle('view--active', view.dataset.view === name);
        }
        for (const tab of tabs) {
          const selected = tab.dataset.viewTarget === name;
          tab.classList.toggle('bottom-nav__item--active', selected);
          if (selected) tab.setAttribute('aria-current','page');
          else tab.removeAttribute('aria-current');
        }
        app.classList.toggle('app--view-home', home);
        document.documentElement.classList.toggle('app-view-home', home);
        document.body.dataset.view = name;
        app.scrollTop = 0;
      }
      for (const tab of tabs) tab.onclick = () => selectTab(tab.dataset.viewTarget);
      selectTab('home');
    </script>
